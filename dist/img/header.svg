<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a0c0c"/>
      <stop offset="45%" stop-color="#c81e1e"/>
      <stop offset="100%" stop-color="#e5484d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#ffb3a7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb3a7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Base red photographic backdrop -->
  <rect width="1200" height="300" fill="url(#base)"/>

  <!-- Soft light blooms, like a photo with lighting -->
  <ellipse cx="860" cy="110" rx="260" ry="170" fill="#ffd0c4" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="260" cy="260" rx="320" ry="120" fill="#4a0505" opacity="0.5" filter="url(#soft)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Abstract subject shapes to suggest a real photo -->
  <g opacity="0.22" fill="#fff" filter="url(#soft)">
    <circle cx="980" cy="70" r="90"/>
    <circle cx="1080" cy="230" r="60"/>
  </g>
  <path d="M0 220 Q 240 170 480 215 T 960 200 T 1200 185 L1200 300 L0 300 Z" fill="#3a0404" opacity="0.35"/>
  <path d="M0 250 Q 300 215 600 245 T 1200 235 L1200 300 L0 300 Z" fill="#250202" opacity="0.4"/>

  <!-- Film grain and vignette: the cues that say "photo", not "flat color" -->
  <rect width="1200" height="300" filter="url(#grain)" opacity="0.6" style="mix-blend-mode:overlay"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>
</svg>
